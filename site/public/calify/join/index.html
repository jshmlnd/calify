<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join on Calify</title>
<style>
  :root { --bg: #0f0b08; --panel: #1a1410; --text: #fbf3e6; --sub: #c9b8a3; --accent: #f08a3c; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 'Segoe UI', system-ui, sans-serif; }
  main { width: min(420px, 100% - 32px); background: var(--panel); border-radius: 12px; padding: 32px 24px; text-align: center; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 0 0 8px; }
  p { color: var(--sub); margin: 0 0 24px; }
  b { color: var(--text); }
  .links { display: flex; flex-direction: column; gap: 12px; }
  .links[hidden] { display: none; }
  a { display: block; padding: 12px 16px; border-radius: 500px; border: 1px solid var(--sub); color: var(--text); font-weight: 600; text-decoration: none; }
  a:hover { border-color: var(--text); }
  a.main { background: var(--accent); border-color: var(--accent); color: var(--bg); }
</style>
</head>
<body>
<main>
  <h1>Listen together</h1>
  <p id="msg">Opening Calify…</p>
  <div class="links" id="links" hidden>
    <a class="main" id="open" href="#">Open Calify</a>
    <a id="win" href="https://github.com/jshmlnd/calify/releases/latest">Get Calify for Windows</a>
    <a id="android" href="https://github.com/jshmlnd/calify/releases/latest">Get Calify for Android</a>
  </div>
</main>
<script>
  // ?c=CALI-0000 → calify://join/CALI-0000. Same rules as the app's normalizeCode.
  const m = String(new URLSearchParams(location.search).get('c') || '').trim().match(/^(?:cali[-\s]?)?(\d{4})$/i)
  const code = m && 'CALI-' + m[1]
  const msg = document.getElementById('msg'), links = document.getElementById('links'), open = document.getElementById('open')
  if (code) {
    const url = 'calify://join/' + code
    msg.innerHTML = 'Joining session <b></b>.'
    msg.querySelector('b').textContent = code
    open.href = url
    location.href = url
    setTimeout(() => { msg.append(' No Calify yet? Get it below.'); links.hidden = false }, 1500)
  } else {
    msg.textContent = "This link doesn't have a valid session code. Ask the host for a new one."
    open.remove()
    links.hidden = false
  }
  // Point the download buttons at the latest release's installer and APK (the release page if that fails).
  fetch('https://api.github.com/repos/jshmlnd/calify/releases/latest').then(r => r.ok ? r.json() : null).then(rel => {
    for (const a of rel?.assets || []) {
      if (/\.exe$/i.test(a.name)) document.getElementById('win').href = a.browser_download_url
      if (/\.apk$/i.test(a.name)) document.getElementById('android').href = a.browser_download_url
    }
  }).catch(() => {})
</script>
</body>
</html>
